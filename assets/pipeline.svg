<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <rect width="1200" height="400" fill="#F7F8FC"/>
  <text x="60" y="70" font-size="34" font-weight="800" fill="#1A2033" font-family="Helvetica, Arial, sans-serif">conference-pitch</text>
  <text x="60" y="105" font-size="18" fill="#5A6478" font-family="Helvetica, Arial, sans-serif">input: 一个大会（名字 + 官网）   →   output: 8 页提案 PDF + 一封可发送的邮件</text>

  <!-- stations -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="60" y="160" width="150" height="90" rx="12" fill="#2E5BFF"/>
    <text x="135" y="200" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">调研</text>
    <text x="135" y="228" font-size="12" fill="#DDE4FF" text-anchor="middle">官网·决策链·金主</text>

    <path d="M214 205 l 16 0 m -6 -6 l 6 6 l -6 6" stroke="#2E5BFF" stroke-width="2.5" fill="none"/>
    <rect x="234" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2E5BFF" stroke-width="2"/>
    <text x="309" y="200" font-size="20" font-weight="700" fill="#1A2033" text-anchor="middle">口径</text>
    <text x="309" y="228" font-size="12" fill="#5A6478" text-anchor="middle">9 条定稿口径</text>

    <path d="M388 205 l 16 0 m -6 -6 l 6 6 l -6 6" stroke="#2E5BFF" stroke-width="2.5" fill="none"/>
    <rect x="408" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2E5BFF" stroke-width="2"/>
    <text x="483" y="200" font-size="20" font-weight="700" fill="#1A2033" text-anchor="middle">素材</text>
    <text x="483" y="228" font-size="12" fill="#5A6478" text-anchor="middle">照片池·软链图库</text>

    <path d="M562 205 l 16 0 m -6 -6 l 6 6 l -6 6" stroke="#2E5BFF" stroke-width="2.5" fill="none"/>
    <rect x="582" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2E5BFF" stroke-width="2"/>
    <text x="657" y="200" font-size="20" font-weight="700" fill="#1A2033" text-anchor="middle">提案</text>
    <text x="657" y="228" font-size="12" fill="#5A6478" text-anchor="middle">8 页 1920×1080</text>

    <path d="M736 205 l 16 0 m -6 -6 l 6 6 l -6 6" stroke="#2E5BFF" stroke-width="2.5" fill="none"/>
    <rect x="756" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2E5BFF" stroke-width="2"/>
    <text x="831" y="200" font-size="20" font-weight="700" fill="#1A2033" text-anchor="middle">导出</text>
    <text x="831" y="228" font-size="12" fill="#5A6478" text-anchor="middle">PDF 逐页验收</text>

    <path d="M910 205 l 16 0 m -6 -6 l 6 6 l -6 6" stroke="#2E5BFF" stroke-width="2.5" fill="none"/>
    <rect x="930" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2E5BFF" stroke-width="2"/>
    <text x="1005" y="200" font-size="20" font-weight="700" fill="#1A2033" text-anchor="middle">邮件</text>
    <text x="1005" y="228" font-size="12" fill="#5A6478" text-anchor="middle">4 段正文+发信清单</text>
  </g>

  <rect x="60" y="290" width="1020" height="60" rx="10" fill="#FFF4E5" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="80" y="327" font-size="16" fill="#8A5A00" font-family="Helvetica, Arial, sans-serif">⛔ 红线：任何对外草稿先过本人，未批不发  ·  用本人邮箱发  ·  不说「全部免费」  ·  主身份只报一个</text>
</svg>
